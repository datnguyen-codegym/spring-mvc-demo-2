
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
logging.level.org.springframework.web.servlet.view=TRACE
logging.level.org.springframework.web.servlet.resource=TRACE

# ---------------------------------------------------------------------------
# DataSource (MySQL)
# Cac gia tri duoi day la default cho moi truong local/dev.
# KHONG commit password that vao day. Uu tien override bang bien moi truong:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# (xem AppConfig doc cac property nay qua @Value voi gia tri mac dinh)
# ---------------------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://127.0.0.1:3306/hibernate-demo?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
db.username=web_app_admin
# De trong: password phai duoc cung cap qua bien moi truong DB_PASSWORD
db.password=

# Hibernate / JPA
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=false
hibernate.hbm2ddl.auto=update
