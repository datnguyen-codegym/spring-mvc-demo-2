
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
logging.level.org.springframework.web.servlet.view=TRACE
logging.level.org.springframework.web.servlet.resource=TRACE

# ---------------------------------------------------------------------------
# DataSource (MySQL)
# Các giá trị dưới đây là default cho môi trường local/dev.
# Không commit password thật vào đây. Ưu tiên override bằng biến môi trường:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# (PersistenceConfig đọc các property này qua @Value với giá trị mặc định)
# ---------------------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://127.0.0.1:3306/hibernate-demo?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
db.username=web_app_admin
# Để trống: password phải được cung cấp qua biến môi trường DB_PASSWORD
db.password=

# Hibernate / JPA
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=false
hibernate.hbm2ddl.auto=update

# ---------------------------------------------------------------------------
# Seed user cho xác thực (Spring Security / HTTP Basic Auth)
# AppUserSeeder tạo sẵn 1 user khi khởi động nếu bảng 'users' chưa có user này.
# Không commit password thật vào đây. Ưu tiên override bằng biến môi trường:
#   AUTH_SEED_PASSWORD
# Để trống auth.seed.password thì seeder bỏ qua tạo user (chỉ log cảnh báo).
# ---------------------------------------------------------------------------
auth.seed.username=admin
auth.seed.password=
auth.seed.roles=ROLE_USER,ROLE_ADMIN
